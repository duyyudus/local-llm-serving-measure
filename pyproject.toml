[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-llm-bench"
version = "0.1.0"
description = "Measure prefill and decode throughput of a local OpenAI-compatible LLM server under parallel load."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "local-llm-serving-measure contributors" }]
keywords = ["llm", "benchmark", "serving", "vllm", "llama.cpp", "throughput"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27",
  "rich>=13.7",
  "tiktoken>=0.7",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
llm-bench = "llmbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
